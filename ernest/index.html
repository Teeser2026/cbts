<style>
/* ============================================================
   ERNEST DEALS — utopia sort prototype v0.2
   Wording lives in DECK / HOUSE / LINES (script). DRAFT = placeholder.
   Scene coordinates are in source-image pixels (1712 x 1152): SCENE.
   ============================================================ */
:root{ --ink:#1b140d; --paper:#e9dcc0; --paper-2:#d8c6a0; --sepia:#8a6a43;
  --gilt:#c9a45c; --gilt-dim:#8d7340; --u:#c9a45c; --d:#c97a66; }
*{box-sizing:border-box;margin:0;padding:0}
img{-webkit-user-drag:none;user-select:none;-webkit-user-select:none}   /* v2.8: no ghost-dragging the pier or parlour images */
html,body{height:100%}
body{background:#0b0805;color:var(--paper);font-family:"Crimson Pro",Georgia,serif;overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}

/* ---------- the scene (world in image pixels, scaled to cover) ---------- */
#viewport{position:fixed;inset:0;overflow:hidden}
#world{position:absolute;left:0;top:0;width:1712px;height:1152px;transform-origin:0 0;
  transition:transform 1s cubic-bezier(.45,.05,.2,1), filter 1s ease;perspective:1100px;perspective-origin:860px 420px}
#world.zoomed{filter:brightness(.42) saturate(.85)}
#world .frame{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none}
#world .frame.on{opacity:1}
#world .frame.slow{transition:opacity 2.2s ease}
#world .frame.mid{transition:opacity .35s ease}
.glow{position:absolute;width:180px;height:180px;margin:-90px 0 0 -90px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,200,120,.38),rgba(255,170,80,.12) 40%,transparent 70%);
  mix-blend-mode:screen;animation:flicker 3.1s infinite steps(1)}
.glow.b{width:130px;height:130px;margin:-65px 0 0 -65px;animation-duration:2.3s;animation-delay:-.7s}
@keyframes flicker{0%{opacity:.9}11%{opacity:.7}19%{opacity:1}33%{opacity:.8}47%{opacity:.95}58%{opacity:.65}66%{opacity:.9}79%{opacity:.75}90%{opacity:1}}
body.endlit #world{filter:brightness(1.05)}

/* table cards (in world, lying on the baize) */
.tcard{position:absolute;left:0;top:0;width:250px;height:350px;transform-origin:0 0;
  background:url(img/cardanswer.jpg) center/100% 100%;border-radius:14px;box-shadow:0 0 10px 2px rgba(0,0,0,.55);
  transition:transform .6s cubic-bezier(.2,.7,.2,1),opacity .45s;cursor:pointer;
  filter:brightness(.52) contrast(1.18) saturate(.7) sepia(.25)}
.tcard::after{content:"";position:absolute;inset:0;border-radius:14px;background:linear-gradient(to bottom,rgba(0,0,0,.28),transparent 55%)}
.tcard.ready:hover{filter:brightness(.72) contrast(1.15) saturate(.8) sepia(.2)}
#finger{position:absolute;pointer-events:none;z-index:3}
#finger.off{display:none}
.tcard.gone{opacity:0}

#blackout{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:40}
#blackout.on{opacity:1;transition:opacity .12s}
#blackout.flick{animation:flick 1.1s linear forwards}
#portal{position:fixed;z-index:60;overflow:hidden;border-radius:14px;opacity:0;filter:sepia(1) brightness(.6);background:#000;
  transition:left 1.2s cubic-bezier(.6,0,.2,1),top 1.2s cubic-bezier(.6,0,.2,1),width 1.2s cubic-bezier(.6,0,.2,1),height 1.2s cubic-bezier(.6,0,.2,1),
  border-radius 1.2s,opacity .35s,filter 1.4s ease .6s}
#portal.open{left:0!important;top:0!important;width:100vw!important;height:100vh!important;border-radius:0;opacity:1;filter:none}
#portal video{width:100%;height:100%;object-fit:cover;display:block}
@keyframes flick{0%{opacity:1}12%{opacity:.25}18%{opacity:.9}30%{opacity:.1}38%{opacity:.7}52%{opacity:0}60%{opacity:.35}70%,100%{opacity:0}}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 45%,rgba(0,0,0,.72) 100%)}

/* ---------- overlay UI ---------- */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
  opacity:0;pointer-events:none;transition:opacity .9s ease}
.screen.on{opacity:1;pointer-events:auto}
#ui{pointer-events:none}
#ui.on{pointer-events:none}
#ui .live{pointer-events:auto}

#pier{background:#1a1a1c;padding:0;overflow:hidden;cursor:pointer;z-index:30}
#pier .blurbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(30px) brightness(.85);transform:scale(3);transform-origin:88% 22%}
#pierWorld{position:absolute;left:0;top:0;width:720px;height:1280px;transform-origin:0 0;transition:transform 1.4s cubic-bezier(.55,0,.25,1)}
#pierWorld video,#pierWorld .ovl{position:absolute;inset:0;width:100%;height:100%;display:block}
#pierWorld .rglow{position:absolute;left:350px;top:855px;width:80px;height:70px}
#pierWorld .tapstill{position:absolute;inset:0;width:100%;height:100%;opacity:0}
#pierWorld .rglow{animation:rpulse 1.8s ease-in-out infinite}
@keyframes rpulse{0%,100%{opacity:.25}50%{opacity:1}}
#pier.tapped .tapstill{opacity:1}
#pierWorld .paidtxt{position:absolute;left:0;top:0;width:100px;height:56px;transform-origin:0 0;transform:matrix3d(0.210887,0.025383,0.000000,0.000040,0.510297,1.066640,0.000000,0.000936,0.000000,0.000000,1.000000,0.000000,374.500000,878.500000,0.000000,1.000000);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 26px/1 ui-monospace,'DejaVu Sans Mono',Menlo,monospace;
  color:#123a1c;letter-spacing:.02em;opacity:0;transition:opacity .15s .1s}
#pierWorld .paidtxt small{font:700 20px/1 system-ui,sans-serif;margin-top:4px}
#pier.tapped .paidtxt{opacity:.9}
#pier.tapped .rglow{animation:none;opacity:0}
#pierBob{position:absolute;inset:0}
#pier.walking #pierBob{animation:bob 2.2s ease-in-out}
@keyframes bob{0%,100%{transform:translateY(0)}22%{transform:translateY(-6px)}45%{transform:translateY(0)}68%{transform:translateY(-5px)}}
#pier .haze{position:absolute;inset:0;background:rgba(196,196,202,.42);pointer-events:none;transition:opacity 2.2s ease}
#pier.near .haze{opacity:0}
#pier .approach{position:absolute;left:0;right:0;bottom:12vh;text-align:center;color:#f1ece2;text-shadow:0 1px 14px rgba(0,0,0,.75);transition:opacity .6s}
#pier .approach .a1{font:400 clamp(26px,7vw,36px)/1.1 "IM Fell English SC",serif;letter-spacing:.06em}
#pier .approach .a2{font:italic 400 17px/1.4 "IM Fell English",serif;opacity:.85;margin-top:.4em}
#pier.near .approach{opacity:0;pointer-events:none}
#pier:not(.near) .rglow{opacity:0;animation:none}
#pier .veil{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .6s ease;pointer-events:none}
#pier.through .veil{opacity:1}
.wallsign{position:absolute;left:540px;top:874px;width:172px;height:80px}
.gear{position:absolute;pointer-events:none;will-change:transform}
.smoke{position:absolute;pointer-events:none;background:url(img/smoke.png) 0 0/100% auto repeat-y;mix-blend-mode:screen;
  -webkit-mask-image:radial-gradient(ellipse 50% 100% at 50% 100%,#000 25%,transparent 78%);mask-image:radial-gradient(ellipse 50% 100% at 50% 100%,#000 25%,transparent 78%);
  animation:smokeUp var(--t,26s) linear infinite}
.smoke.b{transform:scaleX(-1);animation-delay:-11s}
@keyframes smokeUp{from{background-position:0 0}to{background-position:0 calc(-1 * var(--h))}}
.btn{font-family:"IM Fell English SC",serif;font-size:18px;letter-spacing:.12em;padding:.5em 1.4em;border:1px solid var(--gilt);color:var(--gilt);
  background:rgba(12,8,4,.65);box-shadow:inset 0 0 0 3px rgba(12,8,4,.6),inset 0 0 0 4px var(--gilt-dim);transition:background .2s,color .2s;text-decoration:none;display:inline-block}
.btn:hover,.btn:focus-visible{background:var(--gilt);color:var(--ink);outline:none}
#skip{position:fixed;top:28px;right:12px;font:11px/1 ui-monospace,monospace;letter-spacing:.08em;color:#d08a5a;opacity:.75;z-index:50;padding:6px 0;display:none;text-decoration:underline}
#skip.show{display:block}
#skipHouse{position:fixed;top:46px;right:12px;font:11px/1 ui-monospace,monospace;letter-spacing:.08em;color:#d08a5a;opacity:.75;z-index:50;padding:6px 0;display:none;text-decoration:underline}
#skip.show ~ #skipHouse{display:block}
#skip5{position:fixed;top:64px;right:12px;font:11px/1 ui-monospace,monospace;letter-spacing:.08em;color:#d08a5a;opacity:.75;z-index:50;padding:6px 0;display:none;text-decoration:underline}
#skip.show ~ #skip5{display:block}
.draft,.draft-tag{display:none!important}   /* release: no DRAFT tags anywhere */
body:not(.dev) #skip,body:not(.dev) #skipHouse,body:not(.dev) #skip5{display:none!important}   /* release: prototype tools only with ?dev */
.proto{position:fixed;top:10px;right:12px;font:11px/1 ui-monospace,monospace;letter-spacing:.1em;color:rgba(233,220,192,.45);z-index:50;pointer-events:none}
#mute{position:fixed;top:6px;left:8px;z-index:50;font:18px/1 serif;color:var(--gilt);opacity:.7;padding:6px 8px;display:none}
#mute.show{display:block}
#mute.off{opacity:.35;text-decoration:line-through}

.stagearea{position:relative;flex:1;width:100%;max-width:560px;min-height:0;display:flex;align-items:center;justify-content:center}
.saycard{position:fixed;z-index:6;pointer-events:none;padding:.75em .95em .8em;color:#2a1f13;
  background:#e9dcbf linear-gradient(160deg,rgba(255,250,235,.35),rgba(120,90,50,.18));
  box-shadow:inset 0 0 0 4px #e9dcbf,inset 0 0 0 5px #8a6a43,inset 0 0 0 7px #e9dcbf,inset 0 0 0 8px rgba(138,106,67,.55),3px 6px 14px rgba(0,0,0,.65);
  border-radius:5px;font:italic 400 clamp(16px,4.3vw,21px)/1.3 "IM Fell English",serif;text-align:center;
  transform:rotate(-2.5deg) translateY(-14px);opacity:0;transition:opacity .3s ease,transform .45s cubic-bezier(.3,1.5,.5,1)}
.saycard.on{opacity:1;transform:rotate(-2.5deg)}
.saycard .draft{color:#a0603a}
.subs{position:fixed;z-index:6;pointer-events:none;font-family:"IM Fell English",serif;font-style:italic;color:#efe3c8;
  font-size:clamp(17px,4.6vw,23px);line-height:1.3;text-shadow:0 1px 3px #000,0 0 18px rgba(0,0,0,.9);display:flex;flex-direction:column;gap:.35em}
.subs span{opacity:0;transform:translateY(4px);transition:opacity .45s ease,transform .45s ease}
.subs span.on{opacity:1;transform:none}
.subs.out span{opacity:0;transition-duration:.8s}
.bigcard.aside{transition:transform .7s cubic-bezier(.4,0,.2,1)!important}
.inter{font-family:"IM Fell English",serif;font-style:italic;text-align:center;font-size:clamp(19px,4.8vw,24px);line-height:1.3;
  max-width:30em;width:100%;min-height:2.7em;padding:.5em 1.2em;border-top:1px solid var(--gilt-dim);border-bottom:1px solid var(--gilt-dim);
  background:linear-gradient(90deg,transparent,rgba(10,7,4,.82) 12%,rgba(10,7,4,.82) 88%,transparent);text-shadow:0 1px 8px #000;flex:none;
  transition:opacity .4s}
.inter:empty{opacity:0}
#line .pre{display:block;font-style:normal;font-size:.7em;letter-spacing:.02em;color:var(--paper-2);opacity:.75;margin-bottom:.55em}
#line .ln{display:block}
#line .ln:empty{display:none}
.draft,.draft-tag{font:10px/1 ui-monospace,monospace;font-style:normal;letter-spacing:.08em;color:#d08a5a;vertical-align:super;margin-left:.4em}
.controls{flex:none;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;min-height:56px;margin-top:10px}
.hint{font-family:"IM Fell English",serif;font-style:italic;color:var(--paper-2);opacity:.7;font-size:15px}
.tap{font-family:"IM Fell English SC",serif;font-size:17px;letter-spacing:.18em;color:var(--gilt);text-shadow:0 1px 8px #000;padding:10px 18px;animation:pulseSoft 2.4s infinite}
@keyframes pulseSoft{50%{opacity:.7}}
@keyframes pulse{50%{opacity:.35}}

/* plaques */
.plaques{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:1;opacity:0;transition:opacity .4s}
.plaques.show{opacity:1}
.plaque{pointer-events:auto;writing-mode:vertical-rl;font-family:"IM Fell English SC",serif;font-size:clamp(17px,4.4vw,22px);letter-spacing:.3em;
  padding:1em .45em;border:1px solid currentColor;background:rgba(10,7,4,.78);box-shadow:inset 0 0 0 3px rgba(10,7,4,.7),inset 0 0 0 4px currentColor;
  opacity:.85;transition:opacity .25s,transform .25s,background .25s}
.plaque.left{color:var(--u);transform:rotate(180deg)}
.plaque.right{color:var(--d)}
.plaque.hot{opacity:1}
.plaque.left.hot{transform:rotate(180deg) scale(1.1);background:rgba(201,164,92,.22)}
.plaque.right.hot{transform:scale(1.1);background:rgba(156,74,58,.3)}
.plaques.show .plaque:not(.armed){opacity:.3}

/* the big card */
.bigcard{pointer-events:auto;position:absolute;left:50%;top:50%;width:min(66vw,290px,calc((100vh - 330px) * .672));aspect-ratio:540/804;
  transform-style:preserve-3d;touch-action:none;z-index:2;will-change:transform}
.bigcard .back,.bigcard .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:4.5%/3%;
  box-shadow:0 12px 34px rgba(0,0,0,.7);background-size:100% 100%;overflow:hidden}
.bigcard .back{background-image:url(img/cardanswer.jpg)}
.bigcard .face{background-image:url(img/cardface.jpg);transform:rotateY(180deg);color:var(--ink);container-type:inline-size}
.bigcard.house .face{box-shadow:0 0 0 2px var(--gilt),0 0 44px rgba(201,164,92,.5),0 12px 34px rgba(0,0,0,.7)}
.face > *{position:absolute;left:18%;right:18%;text-align:center}
.face .t{top:16.5%;font-family:"IM Fell English SC",serif;font-size:7.4cqw;letter-spacing:.05em;line-height:1.05;white-space:nowrap}
.face .t.inv{top:auto;bottom:16.5%;transform:rotate(180deg);transition:opacity .3s}
.face .src{top:24%;font:600 4.1cqw/1.25 "Crimson Pro",serif;color:#5a4428;opacity:0;transition:opacity .4s .15s}
.face .body{top:50%;transform:translateY(-50%)}
.face .d{font-family:"IM Fell English",serif;font-style:italic;font-size:5.15cqw;line-height:1.3;color:#2a1f13}
.face .rule{width:40%;height:1px;background:var(--sepia);opacity:.55;margin:6px auto}
.face .stamp{top:auto;bottom:15%;left:50%;right:auto;transform:translateX(-50%) rotate(-8deg) scale(1.7);
  font-family:"IM Fell English SC",serif;font-size:8.5cqw;letter-spacing:.14em;padding:.12em .55em;border:3px double currentColor;white-space:nowrap;
  background:rgba(239,229,206,.92);opacity:0;transition:opacity .25s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.face .stamp.u{color:#7a5a1e}.face .stamp.d{color:#8b2d1e}.face .stamp.n{color:#2b3f33}
.bigcard.revealed .stamp{opacity:1;transform:translateX(-50%) rotate(-8deg) scale(1)}
.bigcard.revealed .src{opacity:1}
.bigcard.revealed .t.inv{opacity:0}
.bigcard.flyaway{transition:transform .5s ease-in,opacity .5s!important;opacity:0}
/* answer side (v0.3): written onto the back at the reveal */
.bigcard .back{container-type:inline-size;color:var(--ink)}
.bigcard .back.answer{background-image:url(img/cardanswer.jpg)}
.back > *{position:absolute;left:13%;right:13%;text-align:center;opacity:0}
.back.answer > .a{opacity:1}
.back .hd{top:35%;left:10%;right:10%}               /* stacked, so a two-line name pushes the rest down */
.back .nm{font-family:"IM Fell English SC",serif;font-size:9.6cqw;line-height:1.05;letter-spacing:.03em}
.back .rl{width:20%;height:1px;background:var(--sepia);margin:4cqw auto}
.back .sr{font-family:"IM Fell English",serif;font-size:5.4cqw;line-height:1.3;color:#3a2c1c}
.back .cq{font-family:"IM Fell English",serif;font-style:italic;font-size:6cqw;line-height:1.3;color:#3a2c1c;margin-top:4cqw}
/* stamp top right beside the top hand; "you said" bottom left beside the bottom hand */
.back .stamp2{top:10%;left:auto;right:10%;transform:rotate(-8deg) scale(1.9);transform-origin:center;font-family:"IM Fell English SC",serif;font-size:9.8cqw;
  letter-spacing:.1em;line-height:1.1;padding:.06em .45em;border:.9cqw double #962018;color:#962018;white-space:nowrap;
  transition:opacity .1s,transform .2s cubic-bezier(.5,1.7,.6,1)}
.back.stamped .stamp2{opacity:.9;transform:rotate(-8deg) scale(1)}
.back .stamp2.n{color:#2b3f33;border-color:#2b3f33}
.back .stamp2.u{color:#8a6416;border-color:#8a6416}
/* house card: both stamps, overlapping (Schrödinger's card) */
.back .stamp2.b2{top:17.5%;right:11%;transform:rotate(5deg) scale(1.9);transition-delay:.28s}
.back.stamped .stamp2.b2{transform:rotate(5deg) scale(1)}
.back .said{top:auto;bottom:9%;left:8%;right:auto;text-align:left;font-family:"IM Fell English",serif;font-style:italic;font-size:5.8cqw;color:#5f4b35;transition:opacity .5s}
.back.saidon .said{opacity:1}
.glow.gutter{animation:none;opacity:.18;transition:opacity .12s}

/* house panel */
.housepanel{max-width:30em;text-align:center;font-family:"IM Fell English",serif;line-height:1.35}
.housepanel .from{font-family:"IM Fell English SC",serif;letter-spacing:.14em;color:var(--gilt);font-size:17px}
.housepanel .blurb{font-style:italic;color:var(--paper);font-size:18px;line-height:1.35;margin:.1em 0 .8em}

/* Your Cards, v2.9: a file in the CBTS feed's styling (tokens from CBTS index.html, phase-1 right pane) */
#mirror{justify-content:flex-start;align-items:center;overflow-y:auto;-webkit-overflow-scrolling:touch;background:rgba(5,3,2,.6);padding:0}
#mirror .pane{--bg:#1a1a1e;--text:#C8C4BC;--dim:#706C66;--bright:#E0DCD4;--card:#1E1E22;--card-b:#2A282E;--inner:#7A5D3A;
  width:100%;max-width:480px;flex:none;min-height:100%;background:var(--bg);color:var(--text);padding:0 12px max(28px,env(safe-area-inset-bottom));box-shadow:0 0 60px #000;
  transform:translateY(100%);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
#mirror.on .pane{transform:none}
#mirror .handset,#mirror .scr{display:contents}
#mirror .hand,#mirror .notch,#mirror .sbar{display:none}
@media (min-width:700px) and (min-height:560px){
  #mirror{overflow:hidden;justify-content:center}
  #mirror .handset{display:block;position:fixed;--S:calc(min(90vh, 820px) * 896 / 597);width:var(--S);height:var(--S);
    left:calc(50% - var(--S) * .5519);top:calc(50% - var(--S) * .4526);   /* screen centre (494.5, 405.5)/896 */transform:translateY(105vh);transition:transform .8s cubic-bezier(.2,.8,.2,1)}
  #mirror.on .handset{transform:none}
  #mirror .hand{display:block;position:absolute;inset:0;width:100%;height:100%;pointer-events:none;user-select:none;
    filter:sepia(.6) brightness(.46) contrast(1.25);-webkit-mask-image:radial-gradient(ellipse 40% 50% at 54% 50%,#000 45%,transparent 92%);mask-image:radial-gradient(ellipse 40% 50% at 54% 50%,#000 45%,transparent 92%)}
  #mirror .scr{display:block;position:absolute;left:39.62%;top:11.94%;width:31.14%;height:66.63%;border-radius:10.9%/5.06%;overflow:hidden;background:#1a1a1e}
  #mirror .notch{display:block;position:absolute;z-index:3;left:27.6%;width:43%;top:0;height:3.35%;background:#050505;border-radius:0 0 14% 14%/0 0 60% 60%}
  #mirror .scr .pane,#mirror.on .scr .pane{width:390px;max-width:none;min-height:0;height:calc(100% / var(--k,1));overflow-y:auto;overflow-x:hidden;scrollbar-width:none;
    transform:scale(var(--k,1));transform-origin:0 0;transition:none;box-shadow:none;padding-bottom:28px}
  #mirror .scr .pane::-webkit-scrollbar{display:none}
  #mirror .sbar{display:flex;justify-content:space-between;align-items:center;height:44px;padding:0 26px 0 30px;font:500 15px/1 Outfit,sans-serif;color:var(--bright);letter-spacing:.02em}

  {"id": "eden", "fam": "myth", "box": "u", "title": "A Taste of Paradise", "name": "Eden", "src": "Hebrew Bible, Genesis 2–3", "text": "A walled garden. Food grows without labour. Clothing is unnecessary. There is one rule, concerning a particular tree.", "reveal": "Everything was provided, on condition you didn't go looking for certain knowledge. One rule. Broken before lunch.", "in": "Placed there", "out": "Evicted"},
  {"id": "cockaigne", "fam": "myth", "box": "u", "title": "The Land of Abundance", "name": "Cockaigne", "src": "Medieval European folklore: the French Cocagne (c.1250), the English Land of Cokaygne (c.1330); painted by Bruegel (1567)", "text": "A country where nobody works. The walls are made of pastry and the roofs are tiled with cakes. Rivers run with wine, roast geese fly into your mouth, and pigs wander the lanes ready-cooked, with knives in their backs so you can help yourself. The longer you sleep, the more you're paid.", "reveal": "A hungry peasant's daydream, while the Church preached against gluttony and the monks ate well. A free lunch? Ask the pig.", "in": "Eat through a mountain of pudding", "out": "Nobody tries"},
  {"id": "heart", "fam": "myth", "box": "u", "title": "The Final Assessment", "name": "The Weighing of the Heart", "src": "Ancient Egypt, Book of the Dead (from c.1550 BC); best known from the Papyrus of Hunefer, British Museum", "text": "At the end, your heart is placed on a scale against a single feather. Forty-two judges hear you swear you have committed none of forty-two wrongs. If your heart is lighter, you pass to the Field of Reeds, where the harvest never fails. You're buried with the right answers and a spell telling your heart not to testify.", "reveal": "Heaven, with an entrance exam, a crib sheet and a cleared browser history. But if your heart's heavier, it's fed to a beast.", "in": "Die, then pass the test", "out": "Die again and cease to exist"},
  {"id": "diyu", "fam": "myth", "box": "d", "title": "Processing", "name": "Diyu", "src": "Chinese folk religion and Buddhism", "text": "On arrival your file is retrieved. You pass through ten courts, each with its own magistrate, each examining a different part of your record. Nothing is forgotten. The filing is excellent.", "reveal": "After the tenth court, an old woman serves you soup that makes you forget everything. They keep the records. You don't.", "in": "Die, then form an orderly line", "out": "Drink the soup"},
  {"id": "oz", "fam": "books", "box": "u", "title": "The Green City", "name": "Emerald City", "src": "L. Frank Baum, The Wonderful Wizard of Oz (1900)", "text": "The most beautiful city in the land. On arrival every visitor is fitted with tinted spectacles, locked on for their own protection.", "reveal": "The Wizard later admitted it was no greener than any other city. The lens was the utopia.", "in": "Follow the yellow brick road", "out": "Knock your heels three times"},
  {"id": "erewhon", "fam": "books", "box": "d", "title": "The Kind Country", "name": "Erewhon", "src": "Samuel Butler, Erewhon (1872)", "text": "Fall ill and you will be tried, sentenced and punished; sickness is a danger to everyone. Embezzle from your employer and a kindly professional will help you straighten yourself out.", "reveal": "They also smashed every recent machine, in case it evolved a mind of its own. Written in 1872. Satire, technically.", "in": "Stumble over the mountains", "out": "By balloon"},

  {"id": "timemachine", "fam": "books", "box": "d", "title": "The Golden Age", "name": "The Time Machine", "src": "H. G. Wells, The Time Machine (1895)", "text": "Far in the future, a gentle people live in a garden that covers the world. No one works, no one is ill, no one argues. They eat fruit, play, and sleep together in great halls. They're frightened of the dark.", "reveal": "Fed and clothed by the creatures below. Who come up at night to eat you.", "in": "Bred", "out": "Dinner"},

function armSort(el, c, isHouse){
  plaques.classList.add('show'); pU.classList.add('armed'); pD.classList.add('armed');
  say(isHouse ? LINES.houseSort : LINES.sort);
  controls.innerHTML = '<span class="hint">swipe left or right · or tap a plaque</span>';

  const setX = x => { el.style.transform = `translate(-50%,-50%) translateX(${x}px) rotate(${x/18}deg) rotateY(${el._rot}deg)`; };
  const hot = x => { pU.classList.toggle('hot', x < -40); pD.classList.toggle('hot', x > 40); };
  const spring = () => { el.style.transition = 'transform .45s cubic-bezier(.3,1.8,.5,1)'; setX(0); hot(0); setTimeout(()=> el.style.transition='', 460); };
  const commit = choice => {
    if (done) return;
    if (isHouse){
      stuck++; spring(); sfx('tick'); sfx('tick', .8, .12);
      if (pose !== 'palmR'){ setPose('palmR','mid'); sfx('gears', .3);                 // "no, not that one"
        setTimeout(() => { if (pose === 'palmR'){ sfx('tick', .8); setPose('master','mid'); } }, 1500); }
      say(LINES.houseStuck[Math.min(stuck-1, LINES.houseStuck.length-1)]);

        controls.innerHTML = '<button class="btn">Turn it over</button>';
        controls.querySelector('button').onclick = () => { done = true; revealHouse(el); };
      }

    done = true; plaques.classList.remove('show'); sfx('swish');
    el.style.transition = 'transform .28s ease-out'; setX(choice==='u' ? -150 : 150); hot(0);       // commit: most of the way to the plaque

    setTimeout(() => reveal(el, c, choice), 960);
  };
  el.onpointerdown = e => { if (done) return; dragging = true; startX = e.clientX; dx = 0; el.setPointerCapture(e.pointerId); };
  el.onpointermove = e => { if (!dragging) return; dx = e.clientX - startX; if (isHouse) dx = Math.sign(dx)*Math.min(Math.abs(dx), 46); setX(dx); hot(dx); };
  el.onpointerup = el.onpointercancel = () => { if (!dragging) return; dragging = false;
    if (Math.abs(dx) > (isHouse ? 30 : 80)) commit(dx < 0 ? 'u' : 'd'); else spring(); };
  pU.onclick = () => commit('u'); pD.onclick = () => commit('d');
  document.onkeydown = e => { if (e.key==='ArrowLeft') commit('u'); if (e.key==='ArrowRight') commit('d'); };
}

  big.style.transform = 'translate(-50%,-50%) translate(0px,0px) scale(1) rotate(0deg) rotateY(180deg)';
  await sleep(1120); big.style.transition = ''; big._rot = 180; busy = false;
  setPose('master'); armSort(big, house, true);
}
/* "Read it for free": the card goes through the cabinet door, the camera follows it into the dark, and the meadow comes up */
async function cabinetPortal(el){
  hideSayCard();
  controls.innerHTML = ''; el.onclick = null;
  el.classList.add('aside');                       // the card steps down out of his way so the smile can be seen
  el.style.transform = `translate(-50%,-50%) translate(0, 34vh) scale(.42) rotateY(${el._rot}deg)`;
  zoomOut(); line.innerHTML = '';
  await sleep(900);
  setPose('smile','mid'); await sleep(400);         // the merest hint of a smile
  await say(LINES.comfy); await sleep(900);
  hideSayCard(); setPose('point'); await sleep(900);
  el.classList.remove('aside');
  const wr = world.getBoundingClientRect(), k = wr.width / SCENE.w, r = el.getBoundingClientRect();
  const dx = wr.left + SCENE.door.x*k - (r.left + r.width/2), dy = wr.top + SCENE.door.y*k - (r.top + r.height/2);
  sfx('creak');
  el.style.transition = 'transform 1.1s cubic-bezier(.5,0,.6,1), opacity .5s ease .7s';
  const ay = innerHeight * .34;                   // v2.9: dx/dy were measured from the stepped-down card (34vh lower); add it back or it flies 34vh too high
  el.style.transform = `translate(-50%,-50%) translate(${dx}px,${dy + ay}px) scale(.06) rotate(8deg) rotateY(${el._rot}deg)`;
  el.style.opacity = 0;
  await sleep(1000);
  line.innerHTML = '';
  cam.z = 7; cam.px = SCENE.door.x; cam.py = SCENE.door.y; world.classList.add('zoomed'); applyCam();   // into the dark
  await sleep(700); $('#blackout').classList.add('on');
  await sleep(500);
  portal({ left:0, top:0, width:innerWidth, height:innerHeight });
}

function showMirror(stage){
  hideSayCard();
  const name = b => b==='u' ? 'Utopia' : 'Dystopia';
  const rows = stage === 'final' ? [...results.filter(r => !r.choice), ...results.filter(r => r.choice)] : results.filter(r => r.choice);   // v2.10: CBTS card pinned to the top
  const hm = d => d ? d.toTimeString().slice(0,5) : '';
  const esc = t => String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const first = (results.find(r => r.t) || {}).t || new Date();
  const opened = first.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }) + ' ' + hm(first);
  $('#fileMeta').innerHTML = `File · Reader · <b>${rows.length} ${rows.length === 1 ? 'entry' : 'entries'}</b> · <span class="nw">Opened ${opened}</span><br>Status: <b>not judged</b>`;   // v2.11: status always on its own line
  $('#mirrorRows').innerHTML = rows.map(r => {
    if (!r.choice) return `<article class="card house"><div class="chrome"><span class="pill u">Utopia</span><span class="pill d">Dystopia</span><span class="said">you said ?</span><span class="tm">${hm(r.t)}</span></div>
      <div class="src">${NOVEL.title}</div><div class="ttl">${esc(r.c.title)}</div><div class="snip">${esc(LINES.houseReveal.t)}</div>
      <div class="tags"><span class="tag"><i>In</i>You tapped your card. £0.00.</span><a class="tag" id="novelLink3" href="${NOVEL.url}"><i>Out</i>${NOVEL.cta}</a></div></article>`;
    const { nm, sr } = identity(r.c), line_ = (r.c.reveal || '').replace(/^(Utopia|Dystopia|Neither)\.\s*/, '');
    return `<article class="card"><div class="chrome"><span class="pill ${r.c.box}">${name(r.c.box)}</span><span class="said">you said ${name(r.choice)}</span><span class="tm">${hm(r.t)}</span></div>
      <div class="src">${sr}</div><div class="ttl">${nm}</div>${line_ ? `<div class="snip">${esc(line_)}</div>` : ''}
      <div class="tags"><span class="tag"><i>In</i>${esc(r.c.in)}</span><span class="tag"><i>Out</i>${esc(r.c.out)}</span></div></article>`;
  }).join('');
  if (stage !== 'final') $('#mirrorRows').insertAdjacentHTML('afterbegin',   // v2.12: the held-back card, where the CBTS card will be pinned (Teeser's wording)
    `<article class="card house pending"><div class="chrome"><span class="pill u">Utopia</span><span class="pill d">Dystopia</span></div>
      <div class="src">1 entry pending</div><div class="ttl">Dealer has an extra card just for you</div>
      <div class="tags"><button class="tag" id="pendBtn">Extra card →</button></div></article>`);
  $('#moral').innerHTML = LINES.moral.t + (LINES.moral.draft ? '<span class="draft-tag">DRAFT</span>' : '');
  $('#mirrorActions').innerHTML = stage === 'final'
    ? `<a class="btn" id="novelLink2" href="${NOVEL.url}">${NOVEL.cta}</a><button class="btn" id="againBtn">Deal again</button>`
    : `<button class="btn" id="backBtn">Now the extra card →</button>`;
  if (stage === 'final'){
    const go_ = e => { e.preventDefault(); portal($('#mirror .pane')); };
    $('#novelLink2').onclick = go_; if ($('#novelLink3')) $('#novelLink3').onclick = go_;
    $('#againBtn').onclick = dealAgain;
  } else { $('#backBtn').onclick = dealHouse; $('#pendBtn').onclick = dealHouse; }
  $('#mirror').scrollTop = 0; $('#mirror .pane').scrollTop = 0;
  $('#sbTime').textContent = new Date().toTimeString().slice(0,5); fitHandset();
  $('#skip').classList.remove('show'); go('mirror');
}
/* the portal: the card opens onto the meadow, in colour, then the novel loads in the same tab on the same scene */
function portal(from){
  const fromEl = from instanceof Element ? from : null, r = fromEl ? fromEl.getBoundingClientRect() : from, p = document.createElement('div'); p.id = 'portal';
  p.innerHTML = '<video poster="img/meadow.jpg" muted playsinline autoplay loop preload="auto"><source src="img/meadow.webm" type="video/webm"><source src="img/meadow.mp4" type="video/mp4"></video>';
  Object.assign(p.style, { left:r.left+'px', top:r.top+'px', width:r.width+'px', height:r.height+'px' });
  document.body.appendChild(p); p.querySelector('video').play().catch(()=>{});
  fadeTo(0, 1400); if (SFX.amb) SFX.amb.volume = 0;
  p.getBoundingClientRect(); p.classList.add('open');
  if (fromEl) setTimeout(() => { fromEl.style.opacity = 0; }, 300);
  setTimeout(() => { location.href = NOVEL.url; }, 2600);
}
addEventListener('pageshow', e => { if (!e.persisted) return;          // back from the novel: the chair is empty
  const p = $('#portal'); if (p) p.remove(); $('#blackout').classList.remove('on');
  document.querySelectorAll('.bigcard').forEach(b => b.remove());
  zoomOut(); setPose('empty'); document.body.classList.add('endlit'); if (SFX.amb) SFX.amb.volume = .1;
  $('#mirror .pane').style.opacity = ''; go('ui'); line.innerHTML = '';
  controls.innerHTML = '<button class="btn" id="cardsBtn">Your cards</button>'; $('#cardsBtn').onclick = () => showMirror('final'); });
function dealAgain(){ $('#skip').classList.add('show'); fadeTo(MUSIC_VOL); document.body.classList.remove('endlit'); setPose('master','slow'); setTimeout(startGame, 600); }
</script>
